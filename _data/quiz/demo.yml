title: "Demo quiz: p-values in a wet-lab scenario"
scenario: >
  You run an experiment comparing control vs treated cells (n=6 per group). You measure
  protein abundance for one target and obtain p = 0.03 from a two-sample t-test.

statements:
  - text: "A p-value of 0.03 means there is a 3% chance the null hypothesis is true."
    correct: false
    feedback: "Incorrect. A p-value is calculated assuming the null is true; it is not the probability the null is true."
  - text: "With n=6 per group, assumptions (e.g., distributional shape/outliers) can materially affect inference."
    correct: true
    feedback: "Correct. Small samples are sensitive to outliers and violations of assumptions."
  - text: "Statistical significance implies the effect is biologically important."
    correct: false
    feedback: "Incorrect. Statistical significance does not guarantee practical/biological importance; effect size and context matter."
